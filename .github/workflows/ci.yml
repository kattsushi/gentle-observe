name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Bun and Nx quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Verify Bun version
        shell: bash
        run: |
          bun_version="$(bun --version)"
          printf 'Bun %s\n' "$bun_version"
          test "$bun_version" = "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Nx quality gates
        run: bunx nx run-many -t format,lint,quality-test,test,typecheck --outputStyle=static --nxBail
